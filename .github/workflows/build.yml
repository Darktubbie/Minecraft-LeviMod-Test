name: Build LeviLauncher Mod

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and CMake
        run: |
          sdkmanager "platform-tools" \
                     "platforms;android-28" \
                     "cmake;3.31.6" \
                     "ndk;28.2.13676358"

      - name: Configure CMake
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/28.2.13676358
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28

      - name: Build and package
        run: cmake --build build --target levi_package

      - name: Upload LeviPack
        uses: actions/upload-artifact@v4
        with:
          name: BedrockMinimal-LeviLauncher
          path: build/*.levipack
          if-no-files-found: error
