name: Build LeviLauncher Mod

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and CMake
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-28" \
            "cmake;3.31.6" \
            "ndk;28.2.13676358"

      - name: Configure CMake
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/28.2.13676358
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28

      - name: Build and package
        run: |
          cmake --build build --target levi_package

      - name: Locate LeviPack
        run: |
          echo "Buscando archivos .levipack..."
          find . -type f -name "*.levipack" -print

      - name: Prepare artifact
        run: |
          mkdir -p build/artifact

          LEVIPACK=$(find build -maxdepth 1 -type f -name "*.levipack" -print -quit)

          if [ -z "$LEVIPACK" ]; then
            echo "ERROR: No se encontró ningún archivo .levipack en build/"
            echo "Contenido de build/:"
            find build -maxdepth 3 -type f -print
            exit 1
          fi

          echo "LeviPack encontrado:"
          echo "$LEVIPACK"

          cp "$LEVIPACK" build/artifact/

      - name: Upload LeviPack
        uses: actions/upload-artifact@v4
        with:
          name: BedrockMinimal-LeviLauncher
          path: build/artifact/*.levipack
          if-no-files-found: error
